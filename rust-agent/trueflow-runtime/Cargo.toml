[package]
name = "trueflow-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TrueFlow runtime library for Rust instrumentation"

[dependencies]
trueflow-macros = { path = "../trueflow-macros" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
parking_lot = "0.12"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies.tokio]
version = "1.0"
features = ["net", "sync", "rt", "io-util"]
optional = true
